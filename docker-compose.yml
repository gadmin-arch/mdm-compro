services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mdm_compro
      POSTGRES_USER: mdm
      POSTGRES_PASSWORD: mdm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./Backend/migrations/002_user_access.up.sql:/docker-entrypoint-initdb.d/002_user_access.sql:ro
      - ./Backend/migrations/003_security.up.sql:/docker-entrypoint-initdb.d/003_security.sql:ro
      - ./Backend/migrations/004_seed_system_pages.up.sql:/docker-entrypoint-initdb.d/004_seed_system_pages.sql:ro
      - ./Backend/migrations/005_analytics.up.sql:/docker-entrypoint-initdb.d/005_analytics.sql:ro
      - ./Backend/migrations/006_two_factor.up.sql:/docker-entrypoint-initdb.d/006_two_factor.sql:ro
      - ./Backend/migrations/007_redirects.up.sql:/docker-entrypoint-initdb.d/007_redirects.sql:ro
      - ./Backend/migrations/008_enrich_content.up.sql:/docker-entrypoint-initdb.d/008_enrich_content.sql:ro
      - ./Backend/migrations/009_category_hierarchy.up.sql:/docker-entrypoint-initdb.d/009_category_hierarchy.sql:ro
      - ./Backend/migrations/010_sync_data.up.sql:/docker-entrypoint-initdb.d/010_sync_data.sql:ro
      - ./Backend/migrations/011_seed_source_media.up.sql:/docker-entrypoint-initdb.d/011_seed_source_media.sql:ro
      - ./Backend/migrations/012_complete_source_catalog.up.sql:/docker-entrypoint-initdb.d/012_complete_source_catalog.sql:ro
      - ./Backend/migrations/013_source_product_image.up.sql:/docker-entrypoint-initdb.d/013_source_product_image.sql:ro
      - ./Backend/migrations/014_source_navigation_hierarchy.up.sql:/docker-entrypoint-initdb.d/014_source_navigation_hierarchy.sql:ro
      - ./Backend/migrations/015_repair_engineering_solution_tree.up.sql:/docker-entrypoint-initdb.d/015_repair_engineering_solution_tree.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdm -d mdm_compro"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./Backend
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      # 3000 is what `pnpm dev` (and .claude/launch.json) uses, 3001 the
      # frontend container, 3010 nginx. Override for other setups.
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3010}
      DATABASE_URL: postgres://mdm:mdm@postgres:5432/mdm_compro?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ACCESS_TOKEN_TTL: 1h
      REFRESH_TOKEN_TTL: 2160h
      SITE_URL: http://localhost:3010
      # Set SMTP_* in an untracked .env file — never commit real credentials.
      EMAIL_FROM: ${EMAIL_FROM:-MDM CMS <no-reply@multidayamitra.co.id>}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: mdm-media
      S3_USE_SSL: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./FrontEnd
    environment:
      CMS_API_BASE_URL: http://api:8080/api/v1/public
      NEXT_PUBLIC_CMS_API_BASE_URL: http://localhost:3010/api/v1/public
      NEXTAUTH_URL: http://localhost:3010
      AUTH_URL: http://localhost:3010
      NEXT_PUBLIC_SITE_URL: http://localhost:3010
      CMS_COOKIE_SECURE: "false"
    ports:
      - "3001:3010"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "3010:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
  minio_data:
